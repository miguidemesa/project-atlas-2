name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Build & test backend
    runs-on: ubuntu-latest
    env:
      # ApiFactory drops and recreates this database; the name must contain "test".
      ATLAS_TEST_DB: Host=localhost;Port=5432;Database=atlas_test;Username=atlas_ci
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atlas_ci
          POSTGRES_DB: atlas_ci
          # Disposable CI database; no persistent credentials.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas_ci -d atlas_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Configure test authentication
        run: |
          jwt_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$jwt_secret"
          echo "Jwt__SecretKey=$jwt_secret" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test --no-build --verbosity normal

  frontend:
    name: Typecheck, lint, test & build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        working-directory: .
      - run: npx tsc --noEmit
      - run: npx eslint src --max-warnings=0
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5080

  packages:
    name: Typecheck & test shared packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w packages
      - run: npm test -w packages

  mobile:
    name: Typecheck & test mobile app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        working-directory: .
      - run: npx tsc --noEmit
      - run: npm test -- --ci
